name: criptoflow

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: criptoflow
      POSTGRES_PASSWORD: criptoflow
      POSTGRES_DB: criptoflow
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: criptoflow
      MINIO_ROOT_PASSWORD: criptoflow123
    ports:
      - "9100:9000"
      - "9101:9001"    
    volumes:
      - miniodata:/data
  airflow:
    image: apache/airflow:2.10.5
    command: standalone
    user: "1000:0"
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      MINIO_ENDPOINT: "http://minio:9000"
      DBT_S3_ENDPOINT: "minio:9000"        # endereço "de dentro do prédio"
      PYTHONPATH: "/opt/airflow/project"           # pra achar bronze.py, silver.py...
      _PIP_ADDITIONAL_REQUIREMENTS: "boto3 pandas pyarrow==25.0.0 requests dbt-duckdb==1.11.0"
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./:/opt/airflow/project
      - /home/betet/.dbt:/home/airflow/.dbt:ro
    
  kafka:
    image: apache/kafka:3.9.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://localhost:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

volumes:
  pgdata:
  miniodata: