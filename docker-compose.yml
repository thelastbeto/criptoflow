name: criptoflow

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: criptoflow
      POSTGRES_PASSWORD: criptoflow
      POSTGRES_DB: criptoflow
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: criptoflow
      MINIO_ROOT_PASSWORD: criptoflow123
    ports:
      - "9100:9000"
      - "9101:9001"    
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata: